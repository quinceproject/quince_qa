<!doctype html>
<html>
<head><meta charset="utf-8"><title>{shop_name}</title></head>
<body style="margin:0;padding:24px;background:#f6f6f6;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#ffffff;padding:24px">
    <tr><td>
      <h1 style="margin:0 0 4px;font-size:20px">{shop_name}</h1>
      <p style="margin:0 0 20px;color:#65635d;font-size:13px">A new question about a product</p>

      <p style="margin:0 0 16px">{customer_name} ({customer_email}) asks about
        <a href="{product_url}" style="color:#1a1a1a">{product_name}</a>:</p>

      <div style="margin:0 0 20px;padding:16px;background:#f7f7f6;border-left:3px solid #fcc804">{question}</div>

      <p style="margin:0;font-size:13px;color:#65635d">Answer it in the shop panel, under Quince project &rarr; Questions. The answer appears on the product page.</p>
    </td></tr>
  </table>
</body>
</html>
