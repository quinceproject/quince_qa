<!doctype html>
<html>
<head><meta charset="utf-8"><title>{shop_name}</title></head>
<body style="margin:0;padding:24px;background:#f6f6f6;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#ffffff;padding:24px">
    <tr><td>
      <h1 style="margin:0 0 4px;font-size:20px">{shop_name}</h1>
      <p style="margin:0 0 20px;color:#65635d;font-size:13px">Twoje pytanie ma odpowiedź</p>

      <p style="margin:0 0 16px">Dzień dobry {customer_name},</p>
      <p style="margin:0 0 16px">{intro}</p>

      <p style="margin:0 0 4px;font-size:13px;color:#65635d">Twoje pytanie</p>
      <div style="margin:0 0 20px;padding:16px;background:#f7f7f6">{question}</div>

      <p style="margin:0 0 4px;font-size:13px;color:#65635d">Nasza odpowiedź</p>
      <div style="margin:0;padding:16px;background:#f7f7f6;border-left:3px solid #fcc804">{answer}</div>
    </td></tr>
  </table>
</body>
</html>
