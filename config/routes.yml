# Ekrany modułu pytań: kolejka i ustawienia.
#
# `_legacy_controller` wskazuje zakładkę silnika, bo moduł bez niego nie działa.
# Moduł nie ma własnej zakładki, więc PrestaShop sprawdza uprawnienia na
# zakładce silnika.
quince_qa:
  path: quince/qa
  methods: [GET]
  defaults:
    _controller: Quince\Qa\Controller\Admin\QueueController::indexAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince'

quince_qa_answer:
  path: quince/qa/answer
  methods: [POST]
  defaults:
    _controller: Quince\Qa\Controller\Admin\QueueController::answerAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:save'

quince_qa_status:
  path: quince/qa/status
  methods: [POST]
  defaults:
    _controller: Quince\Qa\Controller\Admin\QueueController::statusAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:save'

quince_qa_settings:
  path: quince/qa/settings
  methods: [GET]
  defaults:
    _controller: Quince\Qa\Controller\Admin\SettingsController::indexAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince'

quince_qa_settings_save:
  path: quince/qa/settings/save
  methods: [POST]
  defaults:
    _controller: Quince\Qa\Controller\Admin\SettingsController::saveAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:save'
