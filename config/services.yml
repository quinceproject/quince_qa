services:
  _defaults:
    public: true

    # Te trzy linie są obowiązkowe w każdym naszym module.
    #
    # PrestaShop wyszukuje kontrolery modułów wyrażeniem regularnym po treści pliku
    # (`class X extends FrameworkBundleAdminController`) i dopiero wtedy dokłada im
    # tagi, dzięki którym Symfony podaje kontrolerowi jego lokalizator usług.
    # Nasze kontrolery dziedziczą po wspólnej klasie silnika, więc ten wzorzec
    # nie pasuje. Deklarujemy to sami zamiast liczyć na wykrycie.
    autoconfigure: true
    autowire: true
    tags: ['controller.service_arguments']

  Quince\Qa\Controller\Admin\QueueController:
    class: Quince\Qa\Controller\Admin\QueueController
    arguments:
      - '@Quince\Qa\Settings\QaSettings'
      - '@Quince\Qa\Settings\QaStore'

  Quince\Qa\Controller\Admin\SettingsController:
    class: Quince\Qa\Controller\Admin\SettingsController
    arguments:
      - '@Quince\Qa\Settings\QaSettings'

  Quince\Qa\Settings\QaSettings:
    class: Quince\Qa\Settings\QaSettings

  Quince\Qa\Settings\QaStore:
    class: Quince\Qa\Settings\QaStore
